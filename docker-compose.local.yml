# ========================================
# LOCAL DEVELOPMENT - Database Only
# ========================================
# Chạy: docker-compose -f docker-compose.local.yml up -d
# Dùng cho developer chạy PostgreSQL và Redis local

version: '3.8'

networks:
  fams-local:
    driver: bridge

volumes:
  postgres_data:
  redis_data:


services:
  # ==================
  # PostgreSQL Local
  # ==================
  postgres:
    image: postgres:15-alpine
    container_name: fams-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: fams_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fams-local
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================
  # Redis Local
  # ==================
  redis:
    image: redis:7-alpine
    container_name: fams-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fams-local
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

spring:
  application:
    name: FAMS-Backend

  # ========================================
  # PROFILE CONFIGURATION
  # ========================================
  # Profiles: dev (local), test (staging), prod (production)
  # Set active profile via:
  #   - Environment variable: SPRING_PROFILES_ACTIVE=dev
  #   - Command line: --spring.profiles.active=dev
  #   - Docker: -e SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------------- Database (Default uses Neon Production) ----------------
  datasource:
    url: jdbc:postgresql://ep-ancient-glitter-a1qpw4b8-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: ${DATABASE_PASSWORD_PROD:npg_8mbEARX4ehip}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
    open-in-view: false

  # ---------------- Redis ----------------
  data:
    redis:
      host: redis
      port: 6379
      password:
      timeout: 60000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # ---------------- File Upload ----------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # ---------------- Mail ----------------
  mail:
    host: smtp.gmail.com
    port: 587
    username: vtmyduyen3103@gmail.com
    password: zwytifrdkabedwlu
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ---------------- JWT Configuration ----------------
jwt:
  secret: fams-super-secret-key-minimum-256-bits-for-hs256-algorithm-change-this-in-production
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days

# ---------------- AI Service Configuration ----------------
ai-service:
  url: http://ai-service:5000
  timeout: 30000
  endpoints:
    face-recognition: /api/face/recognize
    face-register: /api/face/register
    liveness-detection: /api/face/liveness

# ---------------- File Upload Configuration ----------------
file:
  upload-dir: ./uploads
  max-size: 10485760  # 10MB

# ---------------- Attendance Configuration ----------------
attendance:
  qr-expiration: 300  # 5 minutes in seconds
  check-in-radius: 100  # meters
  allowed-wifi-ssids:
    - FPT_University
    - FPT_Student
    - FPT_Staff

# ---------------- Scheduling Configuration ----------------
scheduling:
  slot-duration: 50  # minutes
  break-duration: 10  # minutes
  slots-per-day: 10
  working-days:
    - MONDAY
    - TUESDAY
    - WEDNESDAY
    - THURSDAY
    - FRIDAY
    - SATURDAY

# ---------------- Logging ----------------
logging:
  level:
    com.fams: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/fams-backend.log
    max-size: 10MB
    max-history: 30

# ---------------- Actuator ----------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false  # Disable mail health check

# ---------------- Springdoc OpenAPI ----------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true


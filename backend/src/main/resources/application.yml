spring:
  application:
    name: FAMS-Backend

  # ========================================
  # PROFILE CONFIGURATION
  # ========================================
  # Profiles: dev (local), test (staging), prod (production)
  # Set active profile via:
  #   - Environment variable: SPRING_PROFILES_ACTIVE=dev
  #   - Command line: --spring.profiles.active=dev
  #   - Docker: -e SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---------------- Database (Default uses Neon Production) ----------------
  datasource:
    url: jdbc:postgresql://ep-ancient-glitter-a1qpw4b8-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&rewriteBatchedInserts=true
    username: neondb_owner
    password: ${DATABASE_PASSWORD_PROD:npg_8mbEARX4ehip}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:100}
      minimum-idle: 20
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true
    open-in-view: false

  # ---------------- Redis ----------------
  data:
    redis:
      host: redis
      port: 6379
      password:
      timeout: 60000
      repositories:
        enabled: false
      jedis:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 5000ms

  # ---------------- File Upload ----------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  # ---------------- Mail ----------------
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
    port: 8080
    error:
        include-message: always
        include-binding-errors: always
    compression:
        enabled: true
        mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
        min-response-size: 1024

# ---------------- JWT Configuration ----------------
jwt:
    secret: fams-super-secret-key-minimum-256-bits-for-hs256-algorithm-change-this-in-production
    expiration: 86400000 # 24 hours in milliseconds
    refresh-expiration: 604800000 # 7 days

# ---------------- AI Service Configuration ----------------
ai-service:
    url: http://ai-service:5000
    timeout: 30000
    endpoints:
        face-recognition: /api/face/recognize
        face-register: /api/face/register
        liveness-detection: /api/face/liveness

# ---------------- File Upload Configuration ----------------
file:
    upload-dir: ./uploads
    max-size: 524288000 # 500MB

# ---------------- Attendance Configuration ----------------
attendance:
    qr-expiration: 300 # 5 minutes in seconds
    check-in-radius: 100 # meters
    allowed-wifi-ssids:
        - FPT_University
        - FPT_Student
        - FPT_Staff

# ---------------- Face Recognition Configuration ----------------
face:
    recognition:
        max-attempts: 5
        wifi-rssi-threshold: -75
        late-threshold-minutes: 15

# ---------------- Scheduling Configuration ----------------
scheduling:
    slot-duration: 50 # minutes
    break-duration: 10 # minutes
    slots-per-day: 10
    working-days:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY

# ---------------- Logging ----------------
logging:
    level:
        com.fams: INFO
        org.springframework.web: WARN
        org.springframework.security: WARN
        org.hibernate.SQL: WARN
        org.hibernate.type.descriptor.sql.BasicBinder: WARN
    pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
        file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file:
        name: logs/fams-backend.log
        max-size: 10MB
        max-history: 30

# ---------------- Actuator ----------------
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus
    endpoint:
        health:
            show-details: always
    health:
        mail:
            enabled: false # Disable mail health check

# ---------------- Springdoc OpenAPI ----------------
springdoc:
    api-docs:
        path: /api-docs
    swagger-ui:
        path: /swagger-ui.html
        enabled: true
    show-actuator: true

# ---------------- Cloudinary Configuration ----------------
cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

# ---------------- App Custom Configuration ----------------
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:backend/service-account.json}

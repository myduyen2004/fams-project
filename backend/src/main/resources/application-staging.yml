spring:
  application:
    name: FAMS Backend Staging
  
  datasource:
    url: ${NEON_STAGING_DB_URL}
    username: ${NEON_STAGING_DB_USER}
    password: ${NEON_STAGING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: redis
      port: 6379

  # Flyway disabled for dev (use ddl-auto: update)
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false
    repair-on-migrate: true

server:
  port: 8081

app:
  environment: staging
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://staging.fams-edu.online,https://fams-staging.vercel.app}
  
logging:
  level:
    root: INFO
    com.fams.backend: INFO

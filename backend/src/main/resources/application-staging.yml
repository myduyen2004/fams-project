spring:
  application:
    name: FAMS Backend Staging
  
  datasource:
    url: ${NEON_STAGING_DB_URL}
    username: ${NEON_STAGING_DB_USER}
    password: ${NEON_STAGING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 30000
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true

  data:
    redis:
      host: redis
      port: 6379

  # Flyway for staging (mirrors production with baseline)
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

server:
  port: 8080

app:
  environment: staging
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://staging.fams-edu.online,https://fams-staging.vercel.app}
  
logging:
  level:
    root: INFO
    com.fams.backend: INFO
    org.hibernate.SQL: INFO

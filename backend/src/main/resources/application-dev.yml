# ========================================
# LOCAL DEVELOPMENT PROFILE
# ========================================
# Mỗi developer dùng Docker PostgreSQL riêng
# Chạy: docker-compose up postgres redis

spring:
  # ---------------- Database (Local Docker) ----------------
  datasource:
    url: jdbc:postgresql://localhost:5432/fams_db
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

  # ---------------- Redis (Local Docker) ----------------
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 60000

# ---------------- AI Service ----------------
ai-service:
  url: http://localhost:5000
  timeout: 30000

# ---------------- Logging (More verbose for dev) ----------------
logging:
  level:
    com.fams: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

spring:
  application:
    name: FAMS Backend
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/fams_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  flyway:
    enabled: false

server:
  port: 8080

app:
  environment: development
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  
logging:
  level:
    root: INFO
    com.fams.backend: DEBUG

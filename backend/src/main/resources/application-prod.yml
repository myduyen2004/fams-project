spring:
  application:
    name: FAMS Backend Production
  
  datasource:
    url: ${NEON_PROD_DB_URL}
    username: ${NEON_PROD_DB_USER}
    password: ${NEON_PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 30000
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  environment: production
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://fams-edu.online,https://www.fams-edu.online}
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL}
    enabled: true
  
  # Flyway for safe production migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true
  
logging:
  level:
    root: WARN
    com.fams.backend: INFO
    org.hibernate.SQL: WARN

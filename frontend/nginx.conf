server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- SỬA LỖI QUAN TRỌNG ---
    # Phải có dòng này để trình duyệt hiểu đâu là file CSS, đâu là JS
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- TỐI ƯU HÓA ---
    # Tăng giới hạn upload nếu web bạn có tính năng up ảnh/avatar (Mặc định Nginx chỉ cho 1MB)
    client_max_body_size 500M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handle React Router (Giữ nguyên)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        client_max_body_size 500M;
        proxy_pass http://backend:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Thêm timeout để tránh lỗi 504 Gateway Time-out nếu Backend xử lý lâu
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    # Cache static assets (Giữ nguyên)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Trang lỗi tùy chỉnh (Optional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
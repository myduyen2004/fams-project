version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fams-backend-prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NEON_PROD_DB_URL=${NEON_PROD_DB_URL}
      - NEON_PROD_DB_USER=${NEON_PROD_DB_USER}
      - NEON_PROD_DB_PASSWORD=${NEON_PROD_DB_PASSWORD}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    ports:
      - "8080:8080"
    networks:
      - fams-network
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: fams-redis-prod
    ports:
      - "6379:6379"
    networks:
      - fams-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  fams-network:
    driver: bridge

name: fams_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  get: ^4.6.6

  # Networking
  dio: ^5.4.0
  http: ^1.2.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Utils
  intl: ^0.19.0
  
  # QR Code Scanning (Fixed version for stability)
  mobile_scanner: ^7.1.4
  
  # Face Recognition
  google_mlkit_face_detection: ^0.10.0
  camera: ^0.10.5+7
  
  # WiFi Detection
  network_info_plus: ^5.0.1

  # Image Picker
  image_picker: ^1.0.7

  # Calendar Integration
  add_2_calendar: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

name: fams_mobile
description: Academic Management System Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  
  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5
  provider: ^6.1.1
  get_it: ^7.6.7
  injectable: ^2.3.2
  
  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.2
  path: ^1.8.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication & Security
  jwt_decoder: ^2.0.1
  crypto: ^3.0.3
  
  # Camera & QR Code
  camera: ^0.10.5+9
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7
  
  # Face Recognition
  google_mlkit_face_detection: ^0.10.0
  tflite_flutter: ^0.10.4
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  permission_handler: ^11.2.0
  
  # WiFi
  wifi_info_flutter: ^2.0.2
  network_info_plus: ^5.0.2
  connectivity_plus: ^5.0.2
  
  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^16.3.2
  
  # Real-time Communication
  socket_io_client: ^2.0.3+1
  
  # Date & Time
  intl: ^0.19.0
  syncfusion_flutter_calendar: ^24.2.4
  table_calendar: ^3.0.9
  
  # File Handling
  file_picker: ^6.1.1
  open_file: ^3.3.2
  path_provider: ^2.1.2
  flutter_pdfview: ^1.3.2
  
  # UI Utilities
  flutter_screenutil: ^5.9.0
  fluttertoast: ^8.2.4
  awesome_dialog: ^3.2.0
  flutter_easyloading: ^3.0.5
  pull_to_refresh: ^2.0.0
  
  # Charts & Graphs
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^24.2.4
  
  # Utils
  url_launcher: ^6.2.3
  share_plus: ^7.2.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  uuid: ^4.3.3
  
  # Animation
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1
  
  # Icons
  flutter_launcher_icons: ^0.13.1

# App Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - assets/models/
  
#   fonts:

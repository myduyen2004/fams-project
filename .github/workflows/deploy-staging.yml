name: Deploy to Staging

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

env:
  EC2_HOST: 16.176.158.195
  EC2_USER: ec2-user

jobs:
  deploy:
    name: Deploy to EC2 Staging
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to EC2
        env:
          NEON_STAGING_DB_URL: ${{ secrets.NEON_STAGING_DB_URL }}
          NEON_STAGING_DB_USER: ${{ secrets.NEON_STAGING_DB_USER }}
          NEON_STAGING_DB_PASSWORD: ${{ secrets.NEON_STAGING_DB_PASSWORD }}
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'EOF'
            cd /home/ec2-user/fams-project || exit 1
            
            # Pull latest code
            git fetch origin
            git checkout staging
            git reset --hard origin/staging  # Force overwrite local changes
            git pull origin staging
            
            # Create .env.staging file with jdbc: prefix
            cat > .env.staging << ENVEOF
NEON_STAGING_DB_URL=jdbc:postgresql://neondb_owner:npg_KH5UoMe0NZYA@ep-shy-truth-a1qqexjr-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
NEON_STAGING_DB_USER=neondb_owner
NEON_STAGING_DB_PASSWORD=npg_KH5UoMe0NZYA
ENVEOF
            
            # Run deployment script
            chmod +x deploy-staging.sh
            ./deploy-staging.sh
          EOF
      
      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "Backend running on http://16.176.158.195:8081"

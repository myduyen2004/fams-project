name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  EC2_HOST: 16.176.158.195
  EC2_USER: ec2-user

jobs:
  deploy:
    name: Deploy to EC2 Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to EC2
        env:
          NEON_PROD_DB_URL: ${{ secrets.NEON_PROD_DB_URL }}
          NEON_PROD_DB_USER: ${{ secrets.NEON_PROD_DB_USER }}
          NEON_PROD_DB_PASSWORD: ${{ secrets.NEON_PROD_DB_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'EOF'
            cd /home/ec2-user/fams-project || exit 1
            
            # Pull latest code
            git fetch origin
            git checkout main
            git reset --hard origin/main  # Force overwrite local changes
            git pull origin main
            
            # Create .env.production file
            cat > .env.production << EOL
          NEON_PROD_DB_URL=${{ secrets.NEON_PROD_DB_URL }}
          NEON_PROD_DB_USER=${{ secrets.NEON_PROD_DB_USER }}
          NEON_PROD_DB_PASSWORD=${{ secrets.NEON_PROD_DB_PASSWORD }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          EOL
            
            # Run deployment script
            chmod +x deploy-production.sh
            ./deploy-production.sh
          EOF
      
      - name: Notify on Failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"❌ GitHub Actions Deployment Failed\", \"color\": 15158332, \"fields\": [{\"name\": \"Environment\", \"value\": \"**PRODUCTION**\", \"inline\": true}, {\"name\": \"Branch\", \"value\": \"main\", \"inline\": true}, {\"name\": \"Workflow\", \"value\": \"${{ github.workflow }}\", \"inline\": true}], \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"}], \"username\": \"FAMS Deploy Monitor\"}"

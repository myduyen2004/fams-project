name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  EC2_HOST: 16.176.158.195
  EC2_USER: ec2-user

jobs:
  deploy:
    name: Deploy to EC2 Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to EC2
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} 'bash -s' << 'ENDSSH'
          cd /home/ec2-user/fams-main || exit 1
          
          # Force reset and sync with remote
          git fetch origin
          git reset --hard origin/main
          
          # Robust URL sanitization
          RAW_URL="${{ secrets.NEON_PROD_DB_URL }}"
          # 1. Trim whitespace
          CLEAN_URL=$(echo "$RAW_URL" | xargs)
          # 2. Strip any protocol prefixes (jdbc:, postgresql://, postgres://)
          CLEAN_URL="${CLEAN_URL#jdbc:}"
          CLEAN_URL="${CLEAN_URL#postgresql://}"
          CLEAN_URL="${CLEAN_URL#postgres://}"
          # 3. Strip user:pass@ if present
          CLEAN_URL="${CLEAN_URL##*@}"
          # 4. Construct final JDBC URL
          URL="jdbc:postgresql://$CLEAN_URL"
          
          echo "NEON_PROD_DB_URL=$URL" > .env.production
          echo 'NEON_PROD_DB_USER=${{ secrets.NEON_PROD_DB_USER }}' >> .env.production
          echo 'NEON_PROD_DB_PASSWORD=${{ secrets.NEON_PROD_DB_PASSWORD }}' >> .env.production
          echo 'DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}' >> .env.production
          
          # Stop old containers
          docker compose -f docker-compose.prod.yml --env-file .env.production down 2>/dev/null || true
          
          # Build and start
          docker compose -f docker-compose.prod.yml --env-file .env.production up --build -d
          
          # Wait for app to start
          echo "Waiting 60s for app to start..."
          sleep 60
          
          # Check health
          if curl -sf http://localhost:8080/actuator/health; then
            echo "✅ Production deployment successful!"
          else
            echo "❌ Health check failed, showing logs:"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs backend --tail=30
            exit 1
          fi
          ENDSSH
      
      - name: Notify on Failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"embeds": [{"title": "❌ Production Deployment Failed", "color": 15158332}], "username": "FAMS Deploy Monitor"}'

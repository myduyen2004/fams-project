version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fams-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fams_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fams-network

  redis:
    image: redis:7-alpine
    container_name: fams-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fams-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: fams-ai-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - fams-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fams-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/fams_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai-service:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - fams-network

volumes:
  postgres_data:

networks:
  fams-network:
    driver: bridge
